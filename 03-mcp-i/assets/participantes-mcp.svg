<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="290" viewBox="0 0 1080 290" role="img" aria-label="Da intenção à execução: acompanhe as responsabilidades"><rect width="1080" height="290" rx="18" fill="#111827"/><text x="30" y="40" fill="#f8fafc" font-size="22" font-family="Arial">Da intenção à execução: acompanhe as responsabilidades</text><rect x="30.0" y="65" width="227.0" height="145" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="45.0" y="97" fill="#7dd3fc" font-size="19" font-family="Arial">Aplicação / host</text><text x="45.0" y="127" fill="#e2e8f0" font-size="16" font-family="Arial">Organiza a experiência.</text><text x="45.0" y="152" fill="#e2e8f0" font-size="16" font-family="Arial">Decide o que disponibiliza.</text><text x="261.0" y="145" fill="#a3e635" font-size="22">→</text><rect x="285.0" y="65" width="227.0" height="145" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="300.0" y="97" fill="#7dd3fc" font-size="19" font-family="Arial">Cliente MCP</text><text x="300.0" y="127" fill="#e2e8f0" font-size="16" font-family="Arial">Envia solicitações.</text><text x="300.0" y="152" fill="#e2e8f0" font-size="16" font-family="Arial">Recebe resultados.</text><text x="516.0" y="145" fill="#a3e635" font-size="22">→</text><rect x="540.0" y="65" width="227.0" height="145" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="555.0" y="97" fill="#7dd3fc" font-size="19" font-family="Arial">Servidor FastMCP</text><text x="555.0" y="127" fill="#e2e8f0" font-size="16" font-family="Arial">Publica capacidades.</text><text x="555.0" y="152" fill="#e2e8f0" font-size="16" font-family="Arial">Valida os argumentos.</text><text x="771.0" y="145" fill="#a3e635" font-size="22">→</text><rect x="795.0" y="65" width="227.0" height="145" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="810.0" y="97" fill="#7dd3fc" font-size="19" font-family="Arial">Função Python</text><text x="810.0" y="127" fill="#e2e8f0" font-size="16" font-family="Arial">Executa o cálculo.</text><text x="810.0" y="152" fill="#e2e8f0" font-size="16" font-family="Arial">Produz dados de saída.</text><text x="30" y="253" fill="#cbd5e1" font-size="17" font-family="Arial">O resultado percorre o caminho de volta. Um modelo é opcional na aplicação consumidora.</text></svg>