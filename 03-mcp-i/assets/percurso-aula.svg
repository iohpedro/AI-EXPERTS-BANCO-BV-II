<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="290" viewBox="0 0 1080 290" role="img" aria-label="A mesma capacidade, três experiências"><rect width="1080" height="290" rx="18" fill="#111827"/><text x="30" y="40" fill="#f8fafc" font-size="22" font-family="Arial">A mesma capacidade, três experiências</text><rect x="30.0" y="65" width="312.0" height="145" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="45.0" y="97" fill="#7dd3fc" font-size="19" font-family="Arial">1 · Função Python</text><text x="45.0" y="127" fill="#e2e8f0" font-size="16" font-family="Arial">O código escolhe a operação.</text><text x="45.0" y="152" fill="#e2e8f0" font-size="16" font-family="Arial">Validamos cálculo e entradas.</text><text x="45.0" y="177" fill="#e2e8f0" font-size="16" font-family="Arial">Ainda não há MCP nem modelo.</text><text x="346.0" y="145" fill="#a3e635" font-size="22">→</text><rect x="370.0" y="65" width="312.0" height="145" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="385.0" y="97" fill="#7dd3fc" font-size="19" font-family="Arial">2 · Chamada MCP</text><text x="385.0" y="127" fill="#e2e8f0" font-size="16" font-family="Arial">O cliente descobre o contrato.</text><text x="385.0" y="152" fill="#e2e8f0" font-size="16" font-family="Arial">O servidor executa a função.</text><text x="385.0" y="177" fill="#e2e8f0" font-size="16" font-family="Arial">Ainda não precisamos de LLM.</text><text x="686.0" y="145" fill="#a3e635" font-size="22">→</text><rect x="710.0" y="65" width="312.0" height="145" rx="12" fill="#1e293b" stroke="#38bdf8"/><text x="725.0" y="97" fill="#7dd3fc" font-size="19" font-family="Arial">3 · Agente consumidor</text><text x="725.0" y="127" fill="#e2e8f0" font-size="16" font-family="Arial">O modelo propõe uma chamada.</text><text x="725.0" y="152" fill="#e2e8f0" font-size="16" font-family="Arial">A aplicação executa via cliente.</text><text x="725.0" y="177" fill="#e2e8f0" font-size="16" font-family="Arial">Inspecionamos a evidência.</text><text x="30" y="253" fill="#cbd5e1" font-size="17" font-family="Arial">Pergunta em cada etapa: quem escolheu a operação e onde o cálculo aconteceu?</text></svg>